name: 🔄 Sync Worker File

on:
  schedule:
    # 每天凌晨1点自动运行 (UTC时间)
    - cron: '0 1 * * *'
  workflow_dispatch: # 支持手动触发
    inputs:
      force_update:
        description: '强制更新（忽略版本检查）'
        required: false
        default: false
        type: boolean
      skip_backup:
        description: '跳过备份'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://api.github.com/repos/byJoey/cfnew/releases
  WORKER_FILE: _worker.js
  VERSION_FILE: .worker_version
  CONFIG_FILE: .worker_config.json

jobs:
  sync-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 🛎️ Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        
    - name: 🏗️ Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install dependencies
      run: |
        npm install axios
        mkdir -p scripts
        
    - name: 📝 Create version manager script
      run: |
        cat > scripts/version-manager.js << 'EOF'
        <上面完整的 version-manager.js 内容>
        EOF
        
    - name: ⚙️ Initialize version manager
      id: init
      run: |
        node -e "
        const VersionManager = require('./scripts/version-manager');
        const manager = new VersionManager();
        manager.initialize();
        console.log('Version manager initialized');
        "
        
    - name: 📋 Get current version info
      id: current_info
      run: |
        CURRENT_INFO=$(node -e "
        const VersionManager = require('./scripts/version-manager');
        const manager = new VersionManager();
        const info = {
            version: manager.getCurrentVersion(),
            worker_hash: manager.getFileHash('$WORKER_FILE'),
            worker_exists: require('fs').existsSync('$WORKER_FILE')
        };
        console.log(JSON.stringify(info));
        ")
        
        echo "current_info=$CURRENT_INFO" >> $GITHUB_OUTPUT
        echo "📄 Current version info: $CURRENT_INFO"
        
    - name: 🌐 Fetch latest release information
      id: fetch_release
      run: |
        node -e "
        const axios = require('axios');
        
        async function fetchLatestRelease() {
            try {
                const response = await axios.get('$REPO_URL/latest', {
                    headers: {
                        'User-Agent': 'GitHub-Actions-Worker-Sync'
                    },
                    timeout: 10000
                });
                
                const release = response.data;
                const latestVersion = release.tag_name || release.name;
                const workerAsset = release.assets.find(asset => asset.name === '_worker.js');
                
                if (!workerAsset) {
                    throw new Error('_worker.js asset not found in latest release');
                }
                
                const result = {
                    version: latestVersion,
                    download_url: workerAsset.browser_download_url,
                    download_size: workerAsset.size,
                    published_at: release.published_at,
                    release_name: release.name,
                    release_body: release.body ? release.body.substring(0, 500) : ''
                };
                
                console.log(JSON.stringify(result));
                
            } catch (error) {
                console.error('Error fetching release:', error.message);
                process.exit(1);
            }
        }
        
        fetchLatestRelease();
        " > release_info.json
        
        RELEASE_INFO=$(cat release_info.json)
        echo "release_info=$RELEASE_INFO" >> $GITHUB_OUTPUT
        echo "🎯 Latest release info: $RELEASE_INFO"
        
    - name: 🔍 Smart version check
      id: version_check
      run: |
        CURRENT_VERSION=$(echo '${{ steps.current_info.outputs.current_info }}' | jq -r '.version // ""')
        LATEST_VERSION=$(echo '${{ steps.fetch_release.outputs.release_info }}' | jq -r '.version')
        FORCE_UPDATE=${{ github.event.inputs.force_update }}
        
        CHECK_RESULT=$(node -e "
        const VersionManager = require('./scripts/version-manager');
        const manager = new VersionManager();
        const result = manager.shouldUpdate('$CURRENT_VERSION', '$LATEST_VERSION', $FORCE_UPDATE);
        console.log(JSON.stringify(result));
        ")
        
        echo "check_result=$CHECK_RESULT" >> $GITHUB_OUTPUT
        echo "🔍 Version check result: $CHECK_RESULT"
        
    - name: 💾 Create backup before update
      if: steps.version_check.outputs.check_result != '' && fromJSON(steps.version_check.outputs.check_result).update && !github.event.inputs.skip_backup
      run: |
        CURRENT_VERSION=$(echo '${{ steps.current_info.outputs.current_info }}' | jq -r '.version // "pre-update"')
        node -e "
        const VersionManager = require('./scripts/version-manager');
        const manager = new VersionManager();
        const backupPath = manager.createBackup('$CURRENT_VERSION');
        if (backupPath) {
            console.log('Backup created: ' + backupPath);
        }
        "
        
    - name: 📥 Download latest worker file
      if: steps.version_check.outputs.check_result != '' && fromJSON(steps.version_check.outputs.check_result).update
      run: |
        DOWNLOAD_URL=$(echo '${{ steps.fetch_release.outputs.release_info }}' | jq -r '.download_url')
        EXPECTED_SIZE=$(echo '${{ steps.fetch_release.outputs.release_info }}' | jq -r '.download_size')
        
        echo "📥 Downloading from: $DOWNLOAD_URL"
        
        # 下载文件
        curl -s -L -o "$WORKER_FILE.tmp" "$DOWNLOAD_URL" \
          -H "User-Agent: GitHub-Actions-Worker-Sync" \
          -H "Accept: application/octet-stream"
        
        # 验证下载的文件
        node -e "
        const VersionManager = require('./scripts/version-manager');
        const manager = new VersionManager();
        try {
            manager.validateDownloadedFile('$WORKER_FILE.tmp', $EXPECTED_SIZE);
            console.log('✅ File validation passed');
            // 重命名临时文件
            require('fs').renameSync('$WORKER_FILE.tmp', '$WORKER_FILE');
        } catch (error) {
            console.error('❌ File validation failed:', error.message);
            process.exit(1);
        }
        "
        
    - name: 🏷️ Update version file
      if: steps.version_check.outputs.check_result != '' && fromJSON(steps.version_check.outputs.check_result).update
      run: |
        LATEST_VERSION=$(echo '${{ steps.fetch_release.outputs.release_info }}' | jq -r '.version')
        node -e "
        const VersionManager = require('./scripts/version-manager');
        const manager = new VersionManager();
        manager.saveVersion('$LATEST_VERSION');
        console.log('✅ Version updated to: $LATEST_VERSION');
        "
        
    - name: 📊 Generate update report
      if: always()
      run: |
        node -e "
        const VersionManager = require('./scripts/version-manager');
        const manager = new VersionManager();
        
        const report = manager.generateUpdateReport({
            check_result: ${{ steps.version_check.outputs.check_result || 'null' }},
            current_info: ${{ steps.current_info.outputs.current_info || 'null' }},
            release_info: ${{ steps.fetch_release.outputs.release_info || 'null' }},
            update_performed: ${{ steps.version_check.outputs.check_result != '' && fromJSON(steps.version_check.outputs.check_result).update }}
        }, 'sync_worker');
        
        console.log('📊 Update report generated');
        "
        
    - name: 💬 Commit and push changes
      if: steps.version_check.outputs.check_result != '' && fromJSON(steps.version_check.outputs.check_result).update
      run: |
        LATEST_VERSION=$(echo '${{ steps.fetch_release.outputs.release_info }}' | jq -r '.version')
        
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add $WORKER_FILE $VERSION_FILE $CONFIG_FILE
        git commit -m "🔧 chore: update worker file to v$LATEST_VERSION" \
                   -m "Auto-updated worker file to version $LATEST_VERSION"
        
        git push
        echo "✅ Changes committed and pushed"
        
    - name: 🎉 Update successful
      if: steps.version_check.outputs.check_result != '' && fromJSON(steps.version_check.outputs.check_result).update
      run: |
        LATEST_VERSION=$(echo '${{ steps.fetch_release.outputs.release_info }}' | jq -r '.version')
        echo "🎉 Successfully updated to version: $LATEST_VERSION"
        echo "::notice title=Worker Updated::Worker file has been updated to version $LATEST_VERSION"
        
    - name: ℹ️ No update needed
      if: steps.version_check.outputs.check_result != '' && !fromJSON(steps.version_check.outputs.check_result).update
      run: |
        CURRENT_VERSION=$(echo '${{ steps.current_info.outputs.current_info }}' | jq -r '.version // "unknown"')
        REASON=$(echo '${{ steps.version_check.outputs.check_result }}' | jq -r '.reason')
        echo "ℹ️ No update needed. Current version: $CURRENT_VERSION (Reason: $REASON)"
        echo "::notice title=No Update Needed::Worker file is already up to date (v$CURRENT_VERSION)"
        
    - name: ⚠️ Update requires approval
      if: steps.version_check.outputs.check_result != '' && fromJSON(steps.version_check.outputs.check_result).requires_approval
      run: |
        echo "⚠️ This update requires manual approval due to version change type"
        echo "::warning title=Approval Required::This update requires manual approval. Please review the changes."
