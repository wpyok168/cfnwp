name: 🔄 从 cfnew 同步 Releases

on:
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:     # 支持手动运行name: 🔄 从 cfnew 同步 Releases

on:
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:     # 支持手动运行
    inputs:
      action:
        description: '选择要执行的操作'
        required: true
        default: 'check_update'
        type: choice
        options:
        - check_update
        - deploy_only
        - update_and_deploy
      environment:
        description: '部署环境'
        required: false
        default: 'production'
        type: choice
        options:
        - production
        - preview

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析输入参数
        id: parse_input
        run: |
          echo "🎯 工作流执行模式: ${{ github.event.inputs.action }}"
          echo "🌍 部署环境: ${{ github.event.inputs.environment }}"
          echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

      - name: 获取当前版本信息
        id: version_info
        run: |
          echo "🔍 检查版本信息..."
          
          if [ -f version.txt ]; then
            LOCAL_VERSION=$(cat version.txt)
            echo "当前本地版本: $LOCAL_VERSION"
          else
            LOCAL_VERSION="v0.0.0"
            echo "首次运行，设置默认版本: $LOCAL_VERSION"
          fi
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_ENV

      - name: 获取最新发布信息
        id: get_releases
        if: env.ACTION != 'deploy_only'
        run: |
          echo "📡 获取最新发布信息..."
          API_URL="https://api.github.com/repos/byJoey/cfnew/releases"
          RESPONSE=$(curl -s -f "$API_URL")
          
          if [ $? -ne 0 ]; then
            echo "❌ 错误: 无法获取发布信息"
            exit 1
          fi
          
          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "[]" ]; then
            echo "⚠️ 警告: 没有找到任何发布版本"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            exit 0
          fi
          
          # 获取最新正式版
          LATEST_RELEASE=$(echo "$RESPONSE" | jq -r '[.[] | select(.prerelease==false)][0] // "null"')
          if [ "$LATEST_RELEASE" != "null" ]; then
            LATEST_TAG=$(echo "$LATEST_RELEASE" | jq -r '.tag_name // ""')
            LATEST_DOWNLOAD=$(echo "$LATEST_RELEASE" | jq -r '.assets[]? | select(.name=="_worker.js") | .browser_download_url // ""')
          else
            LATEST_TAG=""
            LATEST_DOWNLOAD=""
          fi
          
          # 获取最新Pre-release
          PRE_RELEASE=$(echo "$RESPONSE" | jq -r '[.[] | select(.prerelease==true)][0] // "null"')
          if [ "$PRE_RELEASE" != "null" ]; then
            PRE_TAG=$(echo "$PRE_RELEASE" | jq -r '.tag_name // ""')
            PRE_DOWNLOAD=$(echo "$PRE_RELEASE" | jq -r '.assets[]? | select(.name=="_worker.js") | .browser_download_url // ""')
          else
            PRE_TAG=""
            PRE_DOWNLOAD=""
          fi
          
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "LATEST_DOWNLOAD=$LATEST_DOWNLOAD" >> $GITHUB_ENV
          echo "PRE_TAG=$PRE_TAG" >> $GITHUB_ENV
          echo "PRE_DOWNLOAD=$PRE_DOWNLOAD" >> $GITHUB_ENV
          
          echo "最新正式版: $LATEST_TAG"
          echo "最新Pre-release: $PRE_TAG"

      - name: 智能版本比较
        id: version_compare
        if: env.ACTION != 'deploy_only'
        run: |
          echo "⚖️ 比较版本..."
          TARGET_TAG=""
          TARGET_DOWNLOAD=""
          UPDATE_NEEDED="false"
          UPDATE_TYPE=""
          
          # 优先选择正式版，如果没有则选择Pre-release
          if [ -n "$LATEST_TAG" ] && [ "$LOCAL_VERSION" != "$LATEST_TAG" ]; then
            if [[ "$LATEST_TAG" > "$LOCAL_VERSION" ]] || [[ "$LOCAL_VERSION" == "v0.0.0" ]]; then
              TARGET_TAG="$LATEST_TAG"
              TARGET_DOWNLOAD="$LATEST_DOWNLOAD"
              UPDATE_NEEDED="true"
              UPDATE_TYPE="正式版"
              echo "🎯 选择更新到正式版: $LATEST_TAG"
            fi
          elif [ -n "$PRE_TAG" ] && [ "$LOCAL_VERSION" != "$PRE_TAG" ]; then
            if [[ "$PRE_TAG" > "$LOCAL_VERSION" ]] || [[ "$LOCAL_VERSION" == "v0.0.0" ]]; then
              TARGET_TAG="$PRE_TAG"
              TARGET_DOWNLOAD="$PRE_DOWNLOAD"
              UPDATE_NEEDED="true"
              UPDATE_TYPE="Pre-release"
              echo "🎯 选择更新到Pre-release: $PRE_TAG"
            fi
          fi
          
          if [ "$UPDATE_NEEDED" = "true" ]; then
            echo "🔄 需要更新: $LOCAL_VERSION → $TARGET_TAG ($UPDATE_TYPE)"
            echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
            echo "TARGET_DOWNLOAD=$TARGET_DOWNLOAD" >> $GITHUB_ENV
            echo "UPDATE_NEEDED=$UPDATE_NEEDED" >> $GITHUB_ENV
            echo "UPDATE_TYPE=$UPDATE_TYPE" >> $GITHUB_ENV
          else
            echo "✅ 当前已是最新版本"
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
          fi

      - name: 安全更新文件
        if: env.UPDATE_NEEDED == 'true' && env.ACTION != 'deploy_only'
        run: |
          echo "⬇️ 开始安全更新..."
          echo "目标版本: $TARGET_TAG ($UPDATE_TYPE)"
          
          # 检查下载链接
          if [ -z "$TARGET_DOWNLOAD" ]; then
            echo "❌ 错误: 下载链接为空"
            exit 1
          fi
          
          # 只更新 _worker.js 文件
          echo "下载 _worker.js..."
          if ! wget -q --show-progress -O _worker.js "$TARGET_DOWNLOAD"; then
            echo "❌ 错误: 下载失败"
            exit 1
          fi
          
          # 验证文件是否下载成功
          if [ ! -f _worker.js ]; then
            echo "❌ 错误: 下载文件不存在"
            exit 1
          fi
          
          # 更新版本记录
          echo "$TARGET_TAG" > version.txt
          
          echo "✅ 安全更新完成: $LOCAL_VERSION → $TARGET_TAG"
          echo "📁 更新的文件: _worker.js, version.txt"

      - name: 提交代码更改
        if: env.UPDATE_NEEDED == 'true' && env.ACTION != 'deploy_only'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动更新 Worker - 版本: ${{ env.TARGET_TAG }} (${{ env.UPDATE_TYPE }})"
          file_pattern: "_worker.js version.txt"

      - name: 部署到 Cloudflare Workers
        if: env.ACTION == 'deploy_only' || env.ACTION == 'update_and_deploy' || (env.ACTION == 'check_update' && env.UPDATE_NEEDED == 'true')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          environment: ${{ github.event.inputs.environment }}

      - name: 工作流完成总结
        run: |
          echo "🎉 工作流执行完成"
          echo "────────────────────"
          echo "🎯 执行模式: ${{ env.ACTION }}"
          echo "🌍 部署环境: ${{ env.ENVIRONMENT }}"
          
          if [ "${{ env.ACTION }}" != "deploy_only" ]; then
            echo "📦 当前版本: ${{ env.LOCAL_VERSION }}"
            if [ "${{ env.UPDATE_NEEDED }}" = "true" ]; then
              echo "🚀 更新到版本: ${{ env.TARGET_TAG }} (${{ env.UPDATE_TYPE }})"
            else
              echo "✅ 已是最新版本"
            fi
          fi
          
          if [ "${{ env.ACTION }}" = "deploy_only" ] || [ "${{ env.ACTION }}" = "update_and_deploy" ] || [ "${{ env.UPDATE_NEEDED }}" = "true" ]; then
            echo "☁️ 已部署到 Cloudflare Workers"
          fi
          echo "────────────────────"

      - name: 无需更新提示
        if: env.ACTION == 'check_update' && env.UPDATE_NEEDED != 'true'
        run: |
          echo "✅ 当前已是最新版本，无需更新"
          echo "────────────────────"
          echo "📦 当前版本: $LOCAL_VERSION"
          echo "🎯 最新正式版: $LATEST_TAG"
          echo "🔧 最新Pre-release: $PRE_TAG"
          echo "────────────────────"

    inputs:
      action:
        description: '选择要执行的操作'
        required: true
        default: 'check_update'
        type: choice
        options:
        - check_update
        - deploy_only
        - update_and_deploy
      environment:
        description: '部署环境'
        required: false
        default: 'production'
        type: choice
        options:
        - production
        - preview

permissions:
  contents: write

