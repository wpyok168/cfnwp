name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

jobs:
  sync-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 设置 Git 配置
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git config --local pull.rebase false
      
      - name: 获取 cfnew 最新发布
        id: get_latest
        run: |
          echo "正在获取最新发布信息..."
          API_URL="https://api.github.com/repos/byJoey/cfnew/releases/latest"
          
          # 使用 curl 和 grep 解析 JSON（兼容性最好）
          RESPONSE=$(curl -s -H "Accept: application/vnd.github.v3+json" "$API_URL")
          VERSION=$(echo "$RESPONSE" | grep '"tag_name"' | sed 's/.*"tag_name": "\([^"]*\)".*/\1/')
          ASSETS_URL=$(echo "$RESPONSE" | grep '"assets_url"' | sed 's/.*"assets_url": "\([^"]*\)".*/\1/')
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "最新版本: $VERSION"
          
          if [ -n "$ASSETS_URL" ]; then
            ASSETS_JSON=$(curl -s -H "Accept: application/vnd.github.v3+json" "$ASSETS_URL")
            DOWNLOAD_URL=$(echo "$ASSETS_JSON" | grep '"browser_download_url"' | sed 's/.*"browser_download_url": "\([^"]*\)".*/\1/' | head -1)
            FILE_NAME=$(echo "$ASSETS_JSON" | grep '"name"' | sed 's/.*"name": "\([^"]*\)".*/\1/' | head -1)
            
            echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
            echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
            echo "下载文件: $FILE_NAME"
          else
            echo "download_url=" >> $GITHUB_OUTPUT
            echo "file_name=" >> $GITHUB_OUTPUT
          fi
      
      - name: 检查版本更新
        id: check_version
        run: |
          CURRENT_VERSION=""
          VERSION_FILE="VERSION.txt"
          
          if [ -f "$VERSION_FILE" ] && [ -s "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(cat "$VERSION_FILE" | tr -d '\n\r\t ' | head -1)
            echo "当前版本: $CURRENT_VERSION"
          else
            echo "未找到版本记录文件或文件为空"
          fi
          
          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          
          if [ -z "$NEW_VERSION" ]; then
            echo "错误：无法获取最新版本号"
            exit 1
          fi
          
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          else
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将创建版本记录"
            else
              echo "发现新版本: $CURRENT_VERSION -> $NEW_VERSION"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          fi
          
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      
      - name: 下载新版本文件
        if: steps.check_version.outputs.need_update == 'true' && steps.get_latest.outputs.download_url != ''
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"
          
          echo "正在下载: $FILE_NAME"
          echo "来自: $DOWNLOAD_URL"
          
          # 下载文件
          curl -L -o "$FILE_NAME" "$DOWNLOAD_URL"
          
          # 验证下载
          if [ ! -f "$FILE_NAME" ]; then
            echo "错误：文件下载失败"
            exit 1
          fi
          
          echo "下载成功: $(ls -la "$FILE_NAME")"
          
          # 更新版本记录
          echo "$VERSION" > VERSION.txt
          echo "版本记录已更新: $VERSION"
      
      - name: 提交更改
        if: steps.check_version.outputs.need_update == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 检查是否有变更
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有检测到文件变更"
            exit 0
          fi
          
          echo "检测到以下变更:"
          git status
          git diff --name-status
          
          # 添加所有变更
          git add -A
          
          # 提交变更
          git commit -m "🔔 同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
          
          # 推送变更（使用 token）
          echo "正在推送到仓库..."
          git push "https://$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${GITHUB_REF#refs/heads/}
          
          echo "更改已成功提交并推送"
      
      - name: 生成摘要报告
        run: |
          echo "## 🔄 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **源仓库** | byJoey/cfnew |" >> $GITHUB_STEP_SUMMARY
          echo "| **最新版本** | ${{ steps.get_latest.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **当前版本** | ${{ steps.check_version.outputs.current_version || '无' }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "| **状态** | ✅ 已更新到新版本 |" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.get_latest.outputs.file_name }}" != "" ]; then
              echo "| **下载文件** | ${{ steps.get_latest.outputs.file_name }} |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| **状态** | ⏭️ 已是最新版本 |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**更新时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          
          # 添加调试信息
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 调试信息" >> $GITHUB_STEP_SUMMARY
          echo "- 工作流运行ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- 触发方式: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
