name: Safe Worker Update

on:
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:     # 支持手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 获取最新版本
        id: get_version
        run: |
          echo "🔍 检查最新版本..."
          API_URL="https://api.github.com/repos/byJoey/cfnew/releases/latest"
          RESPONSE=$(curl -s "$API_URL")
          TAG_NAME=$(echo "$RESPONSE" | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo "$RESPONSE" | jq -r '.assets[] | select(.name=="_worker.js") | .browser_download_url')
          
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "❌ 未找到 _worker.js 文件"
            exit 1
          fi
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          
          # 检查是否需要更新
          if [ -f version.txt ] && [ "$(cat version.txt)" = "$TAG_NAME" ]; then
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            echo "✅ 当前已是最新版本: $TAG_NAME"
          else
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
            if [ -f version.txt ]; then
              CURRENT_VERSION=$(cat version.txt)
              echo "🔄 发现新版本: $CURRENT_VERSION → $TAG_NAME"
            else
              echo "🔄 首次安装版本: $TAG_NAME"
            fi
          fi

      - name: 更新 Worker 文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo "⬇️ 下载最新 _worker.js..."
          wget -O _worker.js "$DOWNLOAD_URL"
          
          echo "📝 更新版本记录..."
          echo "$TAG_NAME" > version.txt
          
          echo "✅ 更新完成: $TAG_NAME"

      - name: 提交更改
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 自动更新 Worker 到版本 ${{ env.TAG_NAME }}"
          file_pattern: "_worker.js version.txt"

      - name: 无需更新提示
        if: env.UPDATE_NEEDED != 'true'
        run: |
          echo "✅ 当前已是最新版本，无需更新"
          echo "当前版本: ${{ env.TAG_NAME }}"
