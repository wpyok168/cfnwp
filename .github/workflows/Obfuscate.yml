name: Auto Update Worker

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 1 * * *" # 每天凌晨1点自动运行
  workflow_dispatch:     # 支持手动运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 初始化仓库
        uses: actions/checkout@v4

      - name: 获取当前本地版本信息
        id: get_local_versions
        run: |
          echo -e "\033[34m[获取本地版本信息]\033[0m"
          # 主版本
          if [ -f version.txt ]; then
            MAIN_VERSION=$(cat version.txt)
            echo "当前主版本: $MAIN_VERSION"
          else
            echo "首次同步，没有主版本。"
            MAIN_VERSION=""
          fi
          
          # 额外文件版本
          if [ -f extra_versions.json ]; then
            echo "当前额外文件版本信息:"
            cat extra_versions.json
          else
            echo "没有额外文件版本信息。"
            echo '{"plain_source":"","youth_believe":"","snippets":""}' > extra_versions.json
          fi
          
          echo "MAIN_VERSION=$MAIN_VERSION" >> $GITHUB_ENV

      - name: 获取最新 Release 信息
        id: get_release
        run: |
          echo -e "\033[34m[获取最新 Release]\033[0m"
          API_URL="https://api.github.com/repos/byJoey/cfnew/releases"
          RESPONSE=$(curl -s "$API_URL")
          LATEST_RELEASE=$(echo "$RESPONSE" | jq -r '.[0]')
          TAG_NAME=$(echo "$LATEST_RELEASE" | jq -r '.tag_name')
          DOWNLOAD_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name == "Pages.zip") | .browser_download_url')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo -e "\033[31m未找到 Pages.zip，退出！\033[0m"
            exit 1
          fi
          echo "最新版本号: $TAG_NAME"
          echo "DOWNLOAD_URL=$DOWNLOAD_URL" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV

      - name: 获取额外文件最新版本信息
        id: get_extra_versions
        run: |
          echo -e "\033[34m[获取额外文件最新版本信息]\033[0m"
          
          # 获取额外文件的 ETag (作为版本标识)
          PLAIN_SOURCE_ETAG=$(curl -sI "https://raw.githubusercontent.com/byJoey/cfnew/refs/heads/main/%E6%98%8E%E6%96%87%E6%BA%90%E5%90%97" | grep -i "etag:" | cut -d'"' -f2 || echo "")
          YOUTH_BELIEVE_ETAG=$(curl -sI "https://raw.githubusercontent.com/byJoey/cfnew/refs/heads/main/%E5%B0%91%E5%B9%B4%E4%BD%A0%E7%9B%B8%E4%BF%A1%E5%85%89%E5%90%97" | grep -i "etag:" | cut -d'"' -f2 || echo "")
          SNIPPETS_ETAG=$(curl -sI "https://raw.githubusercontent.com/byJoey/cfnew/refs/heads/main/snippets" | grep -i "etag:" | cut -d'"' -f2 || echo "")
          
          echo "明文源吗 ETag: $PLAIN_SOURCE_ETAG"
          echo "少年你相信光吗 ETag: $YOUTH_BELIEVE_ETAG"
          echo "snippets ETag: $SNIPPETS_ETAG"
          
          # 创建最新版本信息 JSON
          cat > latest_extra_versions.json << EOF
          {
            "plain_source": "$PLAIN_SOURCE_ETAG",
            "youth_believe": "$YOUTH_BELIEVE_ETAG", 
            "snippets": "$SNIPPETS_ETAG"
          }
          EOF
          
          echo "最新额外文件版本信息:"
          cat latest_extra_versions.json

      - name: 判断是否需要更新
        id: check_update
        run: |
          echo -e "\033[34m[判断是否需要更新]\033[0m"
          
          # 读取当前版本信息
          CURRENT_EXTRA_VERSIONS=$(cat extra_versions.json)
          PLAIN_SOURCE_CURRENT=$(echo "$CURRENT_EXTRA_VERSIONS" | jq -r '.plain_source')
          YOUTH_BELIEVE_CURRENT=$(echo "$CURRENT_EXTRA_VERSIONS" | jq -r '.youth_believe')
          SNIPPETS_CURRENT=$(echo "$CURRENT_EXTRA_VERSIONS" | jq -r '.snippets')
          
          # 读取最新版本信息
          LATEST_EXTRA_VERSIONS=$(cat latest_extra_versions.json)
          PLAIN_SOURCE_LATEST=$(echo "$LATEST_EXTRA_VERSIONS" | jq -r '.plain_source')
          YOUTH_BELIEVE_LATEST=$(echo "$LATEST_EXTRA_VERSIONS" | jq -r '.youth_believe')
          SNIPPETS_LATEST=$(echo "$LATEST_EXTRA_VERSIONS" | jq -r '.snippets')
          
          # 判断主版本是否需要更新
          if [ "$MAIN_VERSION" = "$TAG_NAME" ]; then
            echo -e "\033[32m主版本已经是最新版本。\033[0m"
            MAIN_UPDATE_NEEDED=false
          else
            echo -e "\033[33m发现新主版本，需要更新！\033[0m"
            MAIN_UPDATE_NEEDED=true
          fi
          
          # 判断各个额外文件是否需要更新
          PLAIN_SOURCE_UPDATE_NEEDED=false
          YOUTH_BELIEVE_UPDATE_NEEDED=false
          SNIPPETS_UPDATE_NEEDED=false
          
          if [ "$PLAIN_SOURCE_CURRENT" != "$PLAIN_SOURCE_LATEST" ]; then
            echo -e "\033[33m明文源吗有更新！\033[0m"
            PLAIN_SOURCE_UPDATE_NEEDED=true
          else
            echo -e "\033[32m明文源吗无更新。\033[0m"
          fi
          
          if [ "$YOUTH_BELIEVE_CURRENT" != "$YOUTH_BELIEVE_LATEST" ]; then
            echo -e "\033[33m少年你相信光吗有更新！\033[0m"
            YOUTH_BELIEVE_UPDATE_NEEDED=true
          else
            echo -e "\033[32m少年你相信光吗无更新。\033[0m"
          fi
          
          if [ "$SNIPPETS_CURRENT" != "$SNIPPETS_LATEST" ]; then
            echo -e "\033[33msnippets有更新！\033[0m"
            SNIPPETS_UPDATE_NEEDED=true
          else
            echo -e "\033[32msnippets无更新。\033[0m"
          fi
          
          # 设置环境变量
          echo "MAIN_UPDATE_NEEDED=$MAIN_UPDATE_NEEDED" >> $GITHUB_ENV
          echo "PLAIN_SOURCE_UPDATE_NEEDED=$PLAIN_SOURCE_UPDATE_NEEDED" >> $GITHUB_ENV
          echo "YOUTH_BELIEVE_UPDATE_NEEDED=$YOUTH_BELIEVE_UPDATE_NEEDED" >> $GITHUB_ENV
          echo "SNIPPETS_UPDATE_NEEDED=$SNIPPETS_UPDATE_NEEDED" >> $GITHUB_ENV
          
          # 判断是否有任何更新
          if [ "$MAIN_UPDATE_NEEDED" = "true" ] || [ "$PLAIN_SOURCE_UPDATE_NEEDED" = "true" ] || [ "$YOUTH_BELIEVE_UPDATE_NEEDED" = "true" ] || [ "$SNIPPETS_UPDATE_NEEDED" = "true" ]; then
            echo "UPDATE_NEEDED=true" >> $GITHUB_ENV
          else
            echo "UPDATE_NEEDED=false" >> $GITHUB_ENV
            echo -e "\033[32m所有文件都是最新版本，无需更新。\033[0m"
          fi

      - name: 更新主文件
        if: env.MAIN_UPDATE_NEEDED == 'true'
        run: |
          echo -e "\033[34m[更新主文件]\033[0m"
          rm -rf ./*
          echo -e "\033[34m[下载最新 Pages.zip]\033[0m"
          wget -O Pages.zip "$DOWNLOAD_URL"
          echo -e "\033[34m[解压 Pages.zip]\033[0m"
          unzip Pages.zip
          echo -e "\033[34m[删除 Pages.zip]\033[0m"
          rm Pages.zip

      - name: 更新额外文件
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo -e "\033[34m[更新额外文件]\033[0m"
          
          # 更新明文源吗
          if [ "$PLAIN_SOURCE_UPDATE_NEEDED" = "true" ]; then
            echo -e "\033[33m下载更新：明文源吗\033[0m"
            wget -O "明文源吗" "https://raw.githubusercontent.com/byJoey/cfnew/refs/heads/main/%E6%98%8E%E6%96%87%E6%BA%90%E5%90%97"
          else
            echo -e "\033[32m跳过：明文源吗无更新\033[0m"
          fi
          
          # 更新少年你相信光吗
          if [ "$YOUTH_BELIEVE_UPDATE_NEEDED" = "true" ]; then
            echo -e "\033[33m下载更新：少年你相信光吗\033[0m"
            wget -O "少年你相信光吗" "https://raw.githubusercontent.com/byJoey/cfnew/refs/heads/main/%E5%B0%91%E5%B9%B4%E4%BD%A0%E7%9B%B8%E4%BF%A1%E5%85%89%E5%90%97"
          else
            echo -e "\033[32m跳过：少年你相信光吗无更新\033[0m"
          fi
          
          # 更新snippets
          if [ "$SNIPPETS_UPDATE_NEEDED" = "true" ]; then
            echo -e "\033[33m下载更新：snippets\033[0m"
            wget -O "snippets" "https://raw.githubusercontent.com/byJoey/cfnew/refs/heads/main/snippets"
          else
            echo -e "\033[32m跳过：snippets无更新\033[0m"
          fi

      - name: 记录版本信息
        if: env.UPDATE_NEEDED == 'true'
        run: |
          echo -e "\033[34m[记录版本信息]\033[0m"
          
          # 记录主版本
          if [ "$MAIN_UPDATE_NEEDED" = "true" ]; then
            echo "$TAG_NAME" > version.txt
            echo "已记录主版本: $TAG_NAME"
          fi
          
          # 记录额外文件版本
          if [ "$PLAIN_SOURCE_UPDATE_NEEDED" = "true" ] || [ "$YOUTH_BELIEVE_UPDATE_NEEDED" = "true" ] || [ "$SNIPPETS_UPDATE_NEEDED" = "true" ]; then
            cp latest_extra_versions.json extra_versions.json
            echo "已记录额外文件版本信息:"
            cat extra_versions.json
          fi

      - name: 提交更改
        if: env.UPDATE_NEEDED == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |-
            🔄 自动同步更新：
            📦 主版本：${{ env.MAIN_UPDATE_NEEDED == 'true' && env.TAG_NAME || '无更新' }}
            📄 明文源吗：${{ env.PLAIN_SOURCE_UPDATE_NEEDED == 'true' && '已更新' || '无更新' }}
            📄 少年你相信光吗：${{ env.YOUTH_BELIEVE_UPDATE_NEEDED == 'true' && '已更新' || '无更新' }}
            📄 snippets：${{ env.SNIPPETS_UPDATE_NEEDED == 'true' && '已更新' || '无更新' }}
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          push_options: --force
