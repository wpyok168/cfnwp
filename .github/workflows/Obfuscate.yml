name: 从 cfnew 同步 Releases

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'  # 每6小时自动检查一次

jobs:
  sync-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 设置环境
        run: |
          # 创建必要的工作目录
          mkdir -p releases
      
      - name: 获取 cfnew 最新发布
        id: get_latest
        run: |
          echo "正在获取最新发布信息..."
          API_URL="https://api.github.com/repos/byJoey/cfnew/releases/latest"
          
          # 使用 jq 解析 JSON（更可靠）
          if command -v jq >/dev/null 2>&1; then
            RESPONSE=$(curl -s "$API_URL")
            VERSION=$(echo "$RESPONSE" | jq -r '.tag_name // empty')
            ASSETS_URL=$(echo "$RESPONSE" | jq -r '.assets_url // empty')
            
            if [ -n "$ASSETS_URL" ]; then
              ASSETS_JSON=$(curl -s "$ASSETS_URL")
              DOWNLOAD_URL=$(echo "$ASSETS_JSON" | jq -r '.[0].browser_download_url // empty')
              FILE_NAME=$(echo "$ASSETS_JSON" | jq -r '.[0].name // empty')
            fi
          else
            # 回退到 sed 方法
            RESPONSE=$(curl -s "$API_URL")
            VERSION=$(echo "$RESPONSE" | sed -n 's/.*"tag_name": "\([^"]*\)".*/\1/p')
            ASSETS_URL=$(echo "$RESPONSE" | sed -n 's/.*"assets_url": "\([^"]*\)".*/\1/p')
            
            if [ -n "$ASSETS_URL" ]; then
              ASSETS_JSON=$(curl -s "$ASSETS_URL")
              DOWNLOAD_URL=$(echo "$ASSETS_JSON" | sed -n 's/.*"browser_download_url": "\([^"]*\)".*/\1/p' | head -1)
              FILE_NAME=$(echo "$ASSETS_JSON" | sed -n 's/.*"name": "\([^"]*\)".*/\1/p' | head -1)
            fi
          fi
          
          # 验证获取的数据
          if [ -z "$VERSION" ]; then
            echo "错误：无法获取版本号"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "最新版本: $VERSION"
          
          if [ -n "$DOWNLOAD_URL" ] && [ -n "$FILE_NAME" ]; then
            echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
            echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
            echo "文件: $FILE_NAME"
          else
            echo "警告：未找到可下载的文件"
            echo "download_url=" >> $GITHUB_OUTPUT
            echo "file_name=" >> $GITHUB_OUTPUT
          fi
      
      - name: 检查版本更新
        id: check_version
        run: |
          CURRENT_VERSION=""
          VERSION_FILE="VERSION.txt"
          
          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(cat "$VERSION_FILE" | tr -d '\n\r\t ')
            echo "当前版本: $CURRENT_VERSION"
          else
            echo "未找到版本记录文件"
          fi
          
          NEW_VERSION="${{ steps.get_latest.outputs.version }}"
          
          # 版本比较
          if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
            echo "版本相同，无需更新"
            echo "need_update=false" >> $GITHUB_OUTPUT
          else
            if [ -z "$CURRENT_VERSION" ]; then
              echo "首次运行，将创建版本记录"
            else
              echo "发现新版本: $CURRENT_VERSION -> $NEW_VERSION"
            fi
            echo "need_update=true" >> $GITHUB_OUTPUT
          fi
          
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "latest_version=$NEW_VERSION" >> $GITHUB_OUTPUT
      
      - name: 下载新版本文件
        if: steps.check_version.outputs.need_update == 'true' && steps.get_latest.outputs.download_url != ''
        run: |
          DOWNLOAD_URL="${{ steps.get_latest.outputs.download_url }}"
          FILE_NAME="${{ steps.get_latest.outputs.file_name }}"
          VERSION="${{ steps.get_latest.outputs.version }}"
          
          echo "正在下载: $FILE_NAME"
          echo "来自: $DOWNLOAD_URL"
          
          # 下载到 releases 目录
          curl -L -o "releases/$FILE_NAME" "$DOWNLOAD_URL"
          
          # 验证下载
          if [ ! -f "releases/$FILE_NAME" ]; then
            echo "错误：文件下载失败"
            exit 1
          fi
          
          # 记录文件信息
          echo "下载成功:"
          ls -la "releases/$FILE_NAME"
          
          # 更新版本记录
          echo "$VERSION" > VERSION.txt
          echo "版本记录已更新: $VERSION"
      
      - name: 提交更改
        if: steps.check_version.outputs.need_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "没有变更需要提交"
          else
            git commit -m "🔔 同步: 更新到 cfnew ${{ steps.get_latest.outputs.version }}"
            git push
            echo "更改已提交并推送"
          fi
      
      - name: 生成摘要报告
        run: |
          echo "## 🔄 同步完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **源仓库** | byJoey/cfnew |" >> $GITHUB_STEP_SUMMARY
          echo "| **最新版本** | ${{ steps.get_latest.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **当前版本** | ${{ steps.check_version.outputs.current_version || '无' }} |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_version.outputs.need_update }}" = "true" ]; then
            echo "| **状态** | ✅ 已更新到新版本 |" >> $GITHUB_STEP_SUMMARY
            if [ "${{ steps.get_latest.outputs.file_name }}" != "" ]; then
              echo "| **下载文件** | ${{ steps.get_latest.outputs.file_name }} |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| **状态** | ⏭️ 已是最新版本 |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**更新时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
